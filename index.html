<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Flightdeck Studio</title>
    <script>
      // Before first paint: pick up the theme a person chose last time, so a
      // dark-mode reload does not flash Atlas light first. The key is
      // THEME_STORAGE_KEY in src/workbench/theme.ts; rename both together.
      // Guarded, because storage throws in some private windows.
      try {
        var t = localStorage.getItem("flightdeck-studio-theme");
        if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
    <style>
      /* The workbench injects its own stylesheet (theme.ts → WORKBENCH_CSS).
         All this does is stop the page from sitting on the browser default
         white and give .fd-wb the whole viewport to lay itself out in. The
         colours are Atlas's bg/ink, the same as TOKENS in theme.ts; light is
         the default, as in Atlas. */
      html, body, #root { height: 100%; }
      html { color-scheme: light; }
      body { margin: 0; background: #f3f6f7; color: #253d4b; }
      html[data-theme="dark"] { color-scheme: dark; }
      html[data-theme="dark"] body { background: #0e1720; color: #eef2f7; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
