<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Flightdeck Studio</title>
    <!-- Before first paint: the theme a person chose last time. Out of line
         because the server's CSP is `script-src 'self'`; synchronous (no
         async, defer or type="module") so it runs before the first paint.
         See public/theme-boot.js. -->
    <script src="/theme-boot.js"></script>
    <style>
      /* The workbench injects its own stylesheet (theme.ts → WORKBENCH_CSS).
         All this does is stop the page from sitting on the browser default
         white and give .fd-wb the whole viewport to lay itself out in. The
         colours are Atlas's bg/ink, the same as TOKENS in theme.ts; light is
         the default, as in Atlas. */
      html, body, #root { height: 100%; }
      html { color-scheme: light; }
      body { margin: 0; background: #f3f6f7; color: #253d4b; }
      html[data-theme="dark"] { color-scheme: dark; }
      html[data-theme="dark"] body { background: #0e1720; color: #eef2f7; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
