<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DEVELOPMENT local fragment verification</title><style>body{margin:0;font-family:Arial}*{box-sizing:border-box}</style></head><body><script>window.fragmentBrowserErrors=[];window.addEventListener('error',event=>window.fragmentBrowserErrors.push(String(event.message)));window.addEventListener('unhandledrejection',event=>window.fragmentBrowserErrors.push(String(event.reason)));const previousError=console.error;console.error=(...args)=>{window.fragmentBrowserErrors.push(String(args[0]));previousError(...args);};</script><script type="module" src="/src/workflow/__tests__/fragment.browser.tsx"></script></body></html>
